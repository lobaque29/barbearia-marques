  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\">↗\u003c/span>\u003c/a>\u003c/nav>\u003c/header>\n\u003cmain>\n\u003csection class=\"hero\" id=\"inicio\">\u003cdiv class=\"hero-copy\">\u003cp class=\"eyebrow\">Barbearia Marques\u003c/p>\u003ch1>Seu estilo.\u003cbr>\u003cspan>Seu momento.\u003c/span>\u003c/h1>\u003cp>Cuidado de verdade, bons cortes e um espaço feito para você se sentir à vontade. Escolha seu serviço e reserve seu horário.\u003c/p>\u003ca class=\"primary-link\" href=\"#agenda\">Agendar meu horário \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003cdiv class=\"hero-note\">\u003cspan aria-hidden=\"true\">✓\u003c/span> Atendimento com hora marcada\u003c/div>\u003c/div>\u003cdiv class=\"hero-photo\">\u003cimg src=\"unnamed.jpg\" alt=\"Cliente recebendo atendimento na Barbearia Marques\" fetchpriority=\"high\">\u003cdiv class=\"photo-label\">Cortes com personalidade. Atendimento do seu jeito.\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"section gallery\" id=\"galeria\">\u003cdiv class=\"section-heading\">\u003cdiv>\u003cp class=\"eyebrow\">Um espaço feito para você\u003c/p>\u003ch2>Conheça a barbearia\u003c/h2>\u003c/div>\u003cp>Um ambiente confortável, atenção aos detalhes e aquele cuidado que faz a diferença.\u003c/p>\u003c/div>\u003cdiv class=\"gallery-grid\">\n\u003carticle class=\"gallery-card\">\u003cimg src=\"8.jpg\" alt=\"Interior da Barbearia Marques com cadeiras e iluminação moderna\" loading=\"lazy\">\u003c/article>\n\u003carticle class=\"gallery-card\">\u003cimg src=\"2.jpg\" alt=\"Cliente recebendo atendimento na cadeira da barbearia\" loading=\"lazy\">\u003c/article>\n\u003carticle class=\"gallery-card\">\u003cimg src=\"5.jpg\" alt=\"Corte de cabelo infantil feito na barbearia\" loading=\"lazy\">\u003c/article>\n\u003carticle class=\"gallery-card\">\u003cimg src=\"6.jpg\" alt=\"Barba alinhada e acabamento detalhado\" loading=\"lazy\">\u003c/article>\n\u003carticle class=\"gallery-card\">\u003cimg src=\"7.jpg\" alt=\"Cliente relaxando durante o atendimento\" loading=\"lazy\">\u003c/article>\n\u003carticle class=\"gallery-card\">\u003cimg src=\"3.jpg\" alt=\"Área de atendimento da Barbearia Marques\" loading=\"lazy\">\u003c/article>\u003c/div>\u003c/section>\n\u003csection class=\"booking-layout\" aria-label=\"Serviços e agendamento\">\u003csection class=\"services\" id=\"servicos\">\u003cp class=\"eyebrow\">Cuidado com identidade\u003c/p>\u003ch2>Escolha seu serviço\u003c/h2>\u003cp class=\"services-intro\">Selecione uma opção para começar seu agendamento. Os valores podem ser atualizados pela barbearia.\u003c/p>\u003cdiv class=\"service-list\">\u003csc-for list=\"{{svcs}}\" as=\"sv\" hint-placeholder-count=\"4\">\u003cbutton type=\"button\" class=\"service-option\" style=\"{{sv.style}}\" aria-pressed=\"{{sv.selected}}\" sc-camel-on-click=\"{{sv.pick}}\">\u003cspan>{{sv.name}}\u003c/span>\u003cstrong>{{sv.price}}\u003c/strong>\u003c/button>\u003c/sc-for>\u003c/div>\u003cdiv class=\"location-note\">\u003cstrong>Barbearia Marques\u003c/strong>\u003cbr>Rua Herculano Mourão Salazar, Vila Vista Alegre\u003cbr>Belo Horizonte - MG · CEP 30514-510\u003cbr>\u003ca class=\"map-link\" href=\"https://maps.app.goo.gl/onEVXzewdbG6ZWmz5\" target=\"_blank\" rel=\"noopener noreferrer\">Ver localização e como chegar ↗\u003c/a>\u003ciframe class=\"location-map\" title=\"Mapa da localização da Barbearia Marques\" src=\"https://maps.google.com/maps?q=-19.9536659%2C-43.9908032&amp;z=17&amp;output=embed\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\">\u003c/iframe>\u003c/div>\u003c/section>\n\u003caside class=\"booking\" id=\"agenda\">\u003cp class=\"eyebrow\">Vamos marcar?\u003c/p>\u003ch2>Agende seu horário\u003c/h2>\u003cp class=\"booking-intro\">Escolha o serviço, o barbeiro, o melhor dia e horário para você.\u003c/p>\n\u003cdiv class=\"booking-group\">\u003cdiv class=\"booking-label\">1 · Serviço\u003c/div>\u003cdiv class=\"choice-list service-choices\">\u003csc-for list=\"{{svcs}}\" as=\"sv\" hint-placeholder-count=\"4\" tocomplete=\"tel\" maxlength=\"20\" value=\"{{phone}}\" sc-camel-on-input=\"{{setPhone}}\" placeholder=\"DDD + número com WhatsApp\">\u003c/div>\n\u003csc-if value=\"{{canConfirm}}\" hint-placeholder-val=\"{{ true }}\">\u003cbutton type=\"button\" class=\"confirm-link\" disabled=\"{{isBooking}}\" sc-camel-on-click=\"{{book}}\">{{bookingButtonText}}\u003c/button>\u003c/sc-if>\u003csc-if value=\"{{reservationComplete}}\" hint-placeholder-val=\"{{ false }}\">\u003cdiv class=\"booking-success\">{{bookingSuccessMessage}}\u003c/div>\u003c/sc-if>\u003csc-if value=\"{{cannotConfirm}}\" hint-placeholder-val=\"{{ false }}\">\u003cdiv class=\"booking-hint\">{{bookingMessage}}\u003c/div>\u003c/sc-if>\u003csc-if value=\"{{availabilityFailed}}\" hint-placeholder-val=\"{{ false }}\">\u003cbutton type=\"button\" class=\"refresh-button\" sc-camel-on-click=\"{{refresh}}\">Tentar carregar novamente\u003c/button>\u003c/sc-if>\u003c/aside>\u003c/section>\n\u003c/main>\u003cfooter class=\"site-footer\">\u003cdiv class=\"footer-brand\">Barbearia \u003cstrong>Marques\u003c/strong>\u003c/div>\u003cdiv>\u003ca class=\"footer-map-link\" href=\"https://maps.app.goo.gl/onEVXzewdbG6ZWmz5\" target=\"_blank\" rel=\"noopener noreferrer\">Rua Herculano Mourão Salazar · Vila Vista Alegre, Belo Horizonte - MG · Como chegar ↗\u003c/a>\u003c/div>\u003c/footer>\u003c/div>\u003c/x-dc>\u003cscript type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:2000}}\">\nclass Component extends DCLogic {\n  apiBase = (window.BARBEARIA_API_BASE || '/api').replace(/\\/+$/, '');\n  state = { svc: null, barberId: 'any', day: 0, time: null, name: '', phone: '', servicePrices: {}, bookedSlots: [], availabilityStatus: 'loading', bookingStatus: 'idle', bookingError: '', reservation: null };\n  componentDidMount() { this.recordVisit(); this.refreshAvailability(); this.refreshServicePrices(); if ('EventSource' in window && this.isConfigured()) { this.eventSource = new EventSource(this.apiBase + '/events'); this.eventSource.addEventListener('appointments', () => this.refreshAvailability()); this.eventSource.addEventListener('services', () => this.refreshServicePrices()); this.eventSource.onopen = () => { this.refreshAvailability(); this.refreshServicePrices(); }; } this.availabilityTimer = window.setInterval(() => { this.refreshAvailability(); this.refreshServicePrices(); }, 15000); }\n  componentWillUnmount() { window.clearInterval(this.availabilityTimer); if (this.eventSource) this.eventSource.close(); }\n  getDays() {\n    const days = [], date = new Date(this.shopDateKey() + 'T00:00:00Z');\n    while (days.length \u003c 7) { if (date.getUTCDay() !== 0) days.push(new Date(date)); date.setUTCDate(date.getUTCDate() + 1); }\n    return days;\n  }\n  shopDateKey(date = new Date()) {\n    const parts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(date).map(part => [part.type, part.value]));\n    return parts.year + '-' + parts.month + '-' + parts.day;\n  }\n  dateKey(date) { return date.toISOString().slice(0, 10); }\n  isConfigured() { return typeof window !== 'undefined' && (window.location.protocol === 'http:' || window.location.protocol === 'https:'); }\n  recordVisit() {\n    fetch(this.apiBase + '/visits', { method: 'POST', keepalive: true }).then(response => {\n      if (!response.ok) throw new Error('HTTP ' + response.status);\n    }).catch(error => console.warn('Não foi possível registrar a visita:', error));\n  }\n  async refreshServicePrices() {\n    try {\n      const prices = await this.callApi('/services');\n      if (!Array.isArray(prices)) throw new Error('Formato de preços inválido.');\n      this.setState({ servicePrices: Object.fromEntries(prices.map(item => [item.service, item.price_cents])) });\n    } catch (error) { console.error('Não foi possível carregar os valores dos serviços:', error); }\n  }\n  formatPrice(cents) {\n    return Number.isInteger(cents) ? new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(cents / 100) : 'Preço não informado';\n  }\n  async callApi(path, options = {}) {\n    const response = await fetch(this.apiBase + path, { ...options, headers: { 'Content-Type': 'application/json', ...(options.headers || {}) } });\n    const text = await response.text(); let payload = null;\n    if (text) { try { payload = JSON.parse(text); } catch (error) { throw new Error('Resposta inválida do servidor da agenda.'); } }\n    if (!response.ok) { const error = new Error(payload && typeof payload.error === 'string' ? payload.error : 'Erro HTTP ' + response.status); error.status = response.status; throw error; }\n    return payload;\n  }\n  async refreshAvailability() {\n    if (!this.isConfigured()) { this.setState({ availabilityStatus: 'unconfigured' }); return; }\n    if (this.loadingAvailability) { this.availabilityRefreshPending = true; return; }\n    this.loadingAvailability = true;\n    if (this.state.availabilityStatus !== 'ready') this.setState({ availabilityStatus: 'loading' });\n    try {\n      const days = this.getDays();\n      const query = new URLSearchParams({ start_date: this.dateKey(days[0]), end_date: this.dateKey(days[days.length - 1]) });\n      const booked = await this.callApi('/availability?' + query.toString());\n      if (!Array.isArray(booked)) throw new Error('Formato de disponibilidade inválido.');\n      this.setState({ bookedSlots: booked, availabilityStatus: 'ready' });\n    } catch (error) {\n      console.error('Não foi possível carregar a agenda:', error);\n      this.setState({ availabilityStatus: 'error' });\n    } finally { this.loadingAvailability = false; if (this.availabilityRefreshPending) { this.availabilityRefreshPending = false; this.refreshAvailability(); } }\n  }\n  async reserve() {\n    const state = this.state, day = this.getDays()[state.day];\n    const services = { corte: 'Corte', barba: 'Barba', combo: 'Corte + Barba', sobr: 'Sobrancelha' };\n    if (!day || !services[state.svc] || !state.time || state.name.trim().length \u003c 2 || state.phone.replace(/\\D/g, '').length \u003c 10 || state.availabilityStatus !== 'ready' || state.reservation || state.bookingStatus === 'saving') return;\n    this.setState({ bookingStatus: 'saving', bookingError: '' });\n    try {\n      const result = await this.callApi('/appointments', { method: 'POST', body: JSON.stringify({ service: services[state.svc], barber_id: state.barberId, name: state.name.trim(), phone: state.phone, date: this.dateKey(day), time: state.time }) });\n      if (!result || result.reserved !== true) {\n        const slot = this.dateKey(day) + ' ' + state.time;\n        const bookedSlots = state.bookedSlots.some(item => item.booking_date + ' ' + item.booking_time.slice(0, 5) === slot) ? state.bookedSlots : state.bookedSlots.concat({ booking_date: this.dateKey(day), booking_time: state.time + ':00' });\n        this.setState({ bookingStatus: 'taken', bookedSlots, time: null, bookingError: 'Esse horário acabou de ser reservado. Escolha outro horário.' });\n        await this.refreshAvailability(); return;\n      }\n      const assignedBarber = result.booking;\n      if (!assignedBarber || !assignedBarber.barber_id || !assignedBarber.barber_name) throw new Error('O servidor não informou qual barbeiro ficou reservado.');\n      const reservation = { service: services[state.svc], date: this.dateKey(day), time: state.time, name: state.name.trim(), barberId: assignedBarber.barber_id, barberName: assignedBarber.barber_name };\n      this.setState({ reservation, bookedSlots: state.bookedSlots.concat({ booking_date: reservation.date, booking_time: reservation.time + ':00', barber_id: reservation.barberId }), bookingStatus: 'reserved' });\n    } catch (error) {\n      console.error('Não foi possível reservar o horário:', error);\n      if (error.status === 409) {\n        this.setState({ bookingStatus: 'taken', time: null, bookingError: 'Esse horário acabou de ser reservado. Escolha outro horário.' });\n      } else {\n        this.setState({ bookingStatus: 'error', bookingError: error.message || 'Não foi possível reservar. Verifique a conexão e tente novamente.' });\n      }\n      await this.refreshAvailability();\n    }\n  }\n  renderVals() {\n    const state = this.state, weekdays = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];\n    const months = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];\n    const backendConfigured = this.isConfigured();\n    const selected = 'background:#f0d477;color:#171717;border-color:#d4af37', regular = 'background:#1b1b1b;color:#f5f2e8;border-color:#39352a';\n    const unavailable = 'background:#242424;color:#817d73;border-color:#39352a;cursor:not-allowed';\n    const services = [{ id: 'corte', name: 'Corte' }, { id: 'barba', name: 'Barba' }, { id: 'combo', name: 'Corte + Barba' }, { id: 'sobr', name: 'Sobrancelha' }];\n    const svcs = services.map(service => ({ ...service, price: this.formatPrice(state.servicePrices[service.name]), selected: state.svc === service.id, style: state.svc === service.id ? selected : regular, pick: () => { if (!state.reservation) this.setState({ svc: service.id, bookingStatus: 'idle', bookingError: '' }); } }));\n    const barberOptions = [{ id: 'any', name: 'Qualquer barbeiro' }, { id: 'wilson', name: 'Wilson' }, { id: 'barbeiro1', name: 'Barbeiro 1' }, { id: 'barbeiro2', name: 'Barbeiro 2' }];\n    const barbers = barberOptions.map(barber => ({ ...barber, selected: state.barberId === barber.id, style: state.barberId === barber.id ? selected : regular, pick: () => { if (!state.reservation) this.setState({ barberId: barber.id, time: null, bookingStatus: 'idle', bookingError: '' }); } }));\n    const dateList = this.getDays(), selectedDay = dateList[state.day] || dateList[0];\n    const days = dateList.map((date, index) => ({ w: weekdays[date.getUTCDay()], n: date.getUTCDate(), selected: state.day === index, style: state.day === index ? selected : regular, pick: () => { if (!state.reservation) this.setState({ day: index, time: null, bookingStatus: 'idle', bookingError: '' }); } }));\n    const today = this.shopDateKey(), shopHour = Number(new Intl.DateTimeFormat('en-US', { timeZone: 'America/Sao_Paulo', hour: '2-digit', hourCycle: 'h23' }).format(new Date())), booked = new Map();\n    for (const item of state.bookedSlots) {\n      const key = item.booking_date + ' ' + item.booking_time.slice(0, 5);\n      if (!booked.has(key)) booked.set(key, new Set());\n      booked.get(key).add(item.barber_id);\n    }\n    const isBooked = key => { const occupied = booked.get(key) || new Set(); return state.barberId === 'any' ? occupied.size >= 3 : occupied.has(state.barberId); };\n    const ready = state.availabilityStatus === 'ready', slots = [];\n    for (let hour = 9; hour \u003c= 18; hour++) {\n      const time = String(hour).padStart(2, '0') + ':00', key = this.dateKey(selectedDay) + ' ' + time;\n      const disabled = !ready || isBooked(key) || (this.dateKey(selectedDay) === today && hour \u003c= shopHour) || !!state.reservation || state.bookingStatus === 'saving';\n      slots.push({ t: time, disabled, selected: state.time === time, style: disabled ? unavailable : (state.time === time ? selected : regular), pick: () => { if (!disabled) this.setState({ time, bookingStatus: 'idle', bookingError: '' }); } });\n    }\n    const service = services.find(item => item.id === state.svc), dateLabel = weekdays[selectedDay.getUTCDay()] + ' ' + selectedDay.getUTCDate() + '/' + String(selectedDay.getUTCMonth() + 1).padStart(2, '0');\n    const phone = state.phone.replace(/\\D/g, ''), detailsReady = !!(service && state.barberId && state.time && state.name.trim().length > 1 && phone.length >= 10 && phone.length \u003c= 15), slotKey = this.dateKey(selectedDay) + ' ' + state.time;\n    const canConfirm = backendConfigured && ready && detailsReady && !state.reservation && state.bookingStatus !== 'saving' && !isBooked(slotKey);\n    const reservation = state.reservation, reservationDay = reservation ? new Date(reservation.date + 'T12:00:00Z') : selectedDay;\n    const reservationLabel = reservation ? weekdays[reservationDay.getUTCDay()] + ' ' + reservationDay.getUTCDate() + '/' + String(reservationDay.getUTCMonth() + 1).padStart(2, '0') : '';\n    let bookingMessage = 'Escolha serviço, barbeiro, dia e horário; depois informe seu nome e telefone para reservar.';\n    if (!backendConfigured || state.availabilityStatus === 'unconfigured') bookingMessage = 'Abra o site pelo servidor Docker para carregar a agenda compartilhada.';\n    else if (state.availabilityStatus === 'loading') bookingMessage = 'Carregando os horários disponíveis…';\n    else if (state.availabilityStatus === 'error') bookingMessage = 'A agenda online precisa estar conectada ao servidor da barbearia. Entre em contato com o estabelecimento.';\n    else if (state.bookingStatus === 'taken' || state.bookingStatus === 'error') bookingMessage = state.bookingError;\n    else if (detailsReady) bookingMessage = 'Revise seus dados e reserve este horário.';\n    return {\n      svcs, barbers, days, slots, month: months[selectedDay.getMonth()], name: state.name, phone: state.phone,\n      setName: event => { if (!state.reservation) this.setState({ name: event.target.value, bookingStatus: 'idle', bookingError: '' }); },\n      setPhone: event => { if (!state.reservation) this.setState({ phone: event.target.value, bookingStatus: 'idle', bookingError: '' }); },\n      canConfirm, cannotConfirm: !canConfirm, availabilityFailed: state.availabilityStatus === 'error', bookingMessage,\n      bookingButtonText: state.bookingStatus === 'saving' ? 'Reservando horário…' : 'Reservar este horário', isBooking: state.bookingStatus === 'saving', reservationComplete: !!reservation,\n      bookingSuccessMessage: reservation ? 'Horário bloqueado! Sua solicitação está registrada e aguarda confirmação da barbearia: ' + reservation.service + ' · ' + reservation.barberName + ' · ' + reservationLabel + ' · ' + reservation.time : '',\n      book: () => this.reserve(), refresh: () => this.refreshAvailability()\n    };\n  }\n}\n\u003c/script>\u003c/body>\u003c/html>"</script>
