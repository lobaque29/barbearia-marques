services:
  app-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: barbearia
      POSTGRES_USER: ${APP_DB_USER:?Configure APP_DB_USER in .env}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Configure APP_DB_PASSWORD in .env}
    volumes:
      - app_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@app-db:5432/barbearia
    depends_on:
      app-db:
        condition: service_healthy

  notification-worker:
    build: ./backend
    command: ["npm", "run", "worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@app-db:5432/barbearia
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?Configure EVOLUTION_API_KEY in .env}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-barbearia-marques}
      ESTABLISHMENT_WHATSAPP: ${ESTABLISHMENT_WHATSAPP:?Configure ESTABLISHMENT_WHATSAPP in .env}
    depends_on:
      app-db:
        condition: service_healthy
      evolution-api:
        condition: service_started

  web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./2.jpg:/usr/share/nginx/html/2.jpg:ro
      - ./3.jpg:/usr/share/nginx/html/3.jpg:ro
      - ./5.jpg:/usr/share/nginx/html/5.jpg:ro
      - ./6.jpg:/usr/share/nginx/html/6.jpg:ro
      - ./7.jpg:/usr/share/nginx/html/7.jpg:ro
      - ./8.jpg:/usr/share/nginx/html/8.jpg:ro
      - ./unnamed.jpg:/usr/share/nginx/html/unnamed.jpg:ro
    depends_on:
      - api

  evolution-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: ${EVOLUTION_DB_USER:?Configure EVOLUTION_DB_USER in .env}
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:?Configure EVOLUTION_DB_PASSWORD in .env}
    volumes:
      - evolution_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EVOLUTION_PORT:-8080}:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:${EVOLUTION_PORT:-8080}
      TELEMETRY_ENABLED: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_DB_USER}:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: barbearia-marques
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Configure EVOLUTION_API_KEY in .env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      evolution-db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  app_data:
  evolution_data:
  evolution_instances:
  redis_data:
